[project]
name = "hive2snow"
version = "0.1.0"
description = "Hive/Spark SQL -> Snowflake migration agent: convert, run both sides, diff, self-heal"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "anthropic>=2.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "sqlglot>=27",
    "pyspark==3.5.*",
    "duckdb>=1.1",
    "pyarrow>=17",
    "pandas>=2.2",
    "snowflake-connector-python>=3.12",
    "cryptography>=43",
    "tqdm>=4.66",
    "setuptools>=84.2.1",
]

[project.optional-dependencies]
agent = ["langgraph>=0.2"]
app = ["streamlit>=1.40"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7", "mypy>=1.13", "types-pyyaml", "pandas-stubs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hive2snow"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# SQL objects and model prompts are text: don't wrap them
"src/hive2snow/objects.py" = ["E501"]
"src/hive2snow/systems.py" = ["E501"]
"src/hive2snow/agent.py" = ["E501"]
"src/hive2snow/harness.py" = ["E501"]
"scripts/run_eval.py" = ["E501"]
"scripts/final_table.py" = ["E501"]
"app/streamlit_app.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["hive2snow"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
